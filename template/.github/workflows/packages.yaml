name: packages

# See ci.yaml for why the group carries run/skip.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event_name != 'pull_request' ||
    github.event.pull_request.user.login == 'dependabot[bot]' ||
    contains(github.event.pull_request.labels.*.name, 'run-ci'))
    && 'run' || 'skip' }}
  cancel-in-progress: true

# Local packages (packages/*) in their own workflow, filtered by path: packages
# don't import the app's lib/, so a change that leaves packages/ alone cannot
# break them. Path filters are not evaluated for tag pushes, so release tags
# always run this.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "packages/**"
      - ".github/workflows/packages.yaml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/**"
      - ".github/workflows/packages.yaml"
  workflow_dispatch:

jobs:
  packages:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    uses: AppVibeFit/flutter-lean-ci/.github/workflows/packages.yml@v1
    with:
      # Same pins as ci.yaml.
      flutter_version: ""
      very_good_cli_version: ""
      packages_directory: packages
